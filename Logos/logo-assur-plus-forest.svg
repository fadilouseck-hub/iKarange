<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" fill="none">
  <!-- Mark: rounded square (less rounded for editorial feel) -->
  <rect x="4" y="8" width="80" height="80" rx="12" fill="#1F4D3F"/>
  <!-- Cream plus -->
  <rect x="36" y="22" width="16" height="52" rx="2" fill="#FBF8F2"/>
  <rect x="18" y="40" width="52" height="16" rx="2" fill="#FBF8F2"/>
  <!-- Terracotta pulse -->
  <path d="M14 58 L26 58 L30 46 L36 68 L42 40 L48 58 L74 58"
        stroke="#E8724C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Wordmark in Fraunces-like serif fallback (Georgia) -->
  <text x="100" y="60" font-family="Fraunces, Georgia, serif" font-size="42" font-weight="500" fill="#1A1A17" letter-spacing="-2">
    assur<tspan fill="#1F4D3F">+</tspan>
  </text>
  <text x="102" y="80" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#4E4B44" letter-spacing="3">SANTÉ POUR TOUS</text>
</svg>
